name: Metrics
on:
  schedule: [{ cron: "0 3 * * *" }]   # her gün 06:00 (TR)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]
permissions:
  contents: write
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: General stats (private repos included)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.general.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: hakanakdogan
          template: classic
          base: header, activity, community, repositories
          config_timezone: Europe/Istanbul
          repositories_affiliations: owner

      - name: Languages (private repos included)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: hakanakdogan
          template: classic
          base: ""
          config_timezone: Europe/Istanbul
          plugin_languages: yes
          repositories_affiliations: owner
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
          plugin_languages_ignored: html, css, scss, shell, dockerfile
