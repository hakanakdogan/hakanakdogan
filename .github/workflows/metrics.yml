name: Profile cards
on:
  schedule: [{ cron: "0 3 * * *" }]   # her gün 06:00 (TR)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml, .github/scripts/cards.py]
permissions:
  contents: write
jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate cards (private repos included)
        run: python .github/scripts/cards.py
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg languages.svg
          git diff --cached --quiet || (git commit -m "Update profile cards [skip ci]" && git push)
